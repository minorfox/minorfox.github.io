<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黄鹂 (Li Huang) — SWUFE · NLP, RAG, AI for Business</title>
  <meta name="description" content="黄鹂，西南财经大学计算机与人工智能学院副教授、人工智能系主任、计算能力培养中心主任。研究方向：生成过程中的上下文效应、NLP/RAG/ICL、AI for Business、时空数据挖掘。" />
  <meta property="og:title" content="Li Huang (黄鹂) — Associate Professor, SWUFE" />
  <meta property="og:description" content="Associate Professor at SWUFE. Research in Contextual Effects in Generation, NLP/RAG/ICL, AI for Business, and Spatiotemporal Data Mining." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/portrait.jpg" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Clean geometric sans (Raleway + Roboto + Poppins + Noto Sans SC, graceful offline fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Raleway:wght@600;700;800&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Prominent Top-Right Language Switch -->
  <div class="floating-tools" role="group" aria-label="Language switch">
    <span class="lang-globe" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    </span>
    <button type="button" class="lang-btn active" data-lang="zh">中文</button>
    <button type="button" class="lang-btn" data-lang="en">English</button>
  </div>

  <!-- Mobile Sidebar Toggle Button (<1200px) -->
  <button type="button" class="header-toggle" id="header-toggle" aria-label="Toggle navigation" aria-expanded="false">
    <svg id="menu-icon-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"></line>
      <line x1="4" y1="12" x2="20" y2="12"></line>
      <line x1="4" y1="17" x2="20" y2="17"></line>
    </svg>
    <svg id="menu-icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="6" y1="6" x2="18" y2="18"></line>
      <line x1="18" y1="6" x2="6" y2="18"></line>
    </svg>
  </button>

  <!-- Floating Left Circular Pill Navigation (MyResume style) -->
  <header id="header" class="header" aria-label="Primary navigation">
    <nav class="navmenu" id="navmenu">
      <ul id="nav-links"></ul>
    </nav>
  </header>

  <main class="main">
    <!-- 1. Compact Full-Bleed Atmospheric Hero -->
    <section id="home" class="home">
      <img class="home-bg" src="assets/hero-bg.jpg" alt="" aria-hidden="true" />
      <div class="container home-inner">
        <div class="home-content">
          <h1 class="home-name" id="home-name"></h1>
          <p class="home-typed-line">
            <span class="typed-text" id="typed-text"></span>
          </p>
          <div class="social-links" id="home-socials"></div>
        </div>
      </div>
    </section>

    <!-- 2. Profile & Facts (directly below hero, no redundant "About" heading) -->
    <section id="about" class="section section-profile">
      <div class="container">
        <div class="about-grid">
          <div class="about-photo">
            <img src="assets/portrait.jpg?v=2" alt="Dr. Li Huang (黄鹂)" />
          </div>

          <div class="about-content">
            <h3 class="about-name" id="about-name"></h3>
            <div class="about-meta-grid" id="about-meta"></div>
            <div class="about-bio" id="about-bio"></div>
          </div>
        </div>

        <!-- Borderless Facts Row -->
        <div class="facts-row" id="facts-row"></div>
      </div>
    </section>

    <!-- 3. News -->
    <section id="news" class="section">
      <div class="container">
        <div class="section-title">
          <h2 id="news-heading"></h2>
        </div>
        <div class="news-list" id="news-list"></div>
        <div class="news-more-wrap" id="news-more-wrap"></div>
      </div>
    </section>

    <!-- 4. Publications (Borderless Typographic List) -->
    <section id="publications" class="section">
      <div class="container">
        <div class="section-title">
          <h2 id="pub-heading"></h2>
          <p id="pub-subtitle"></p>
        </div>

        <div class="pub-controls">
          <div class="pub-filters" id="pub-filters" role="tablist" aria-label="Publication filters"></div>
          <label class="pub-search" aria-label="Search publications">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="pub-search-input" autocomplete="off" />
          </label>
        </div>

        <div class="pub-meta-line">
          <span id="pub-count"></span>
          <span id="pub-legend"></span>
        </div>

        <div class="pub-list" id="pub-list"></div>
      </div>
    </section>

    <!-- 5. Projects & Open-Source Tools -->
    <section id="projects" class="section">
      <div class="container">
        <div class="section-title">
          <h2 id="proj-heading"></h2>
          <p id="proj-subtitle"></p>
        </div>
        <div class="projects-layout" id="projects-grid"></div>
      </div>
    </section>

    <!-- 6. Resume (2-Column Left-Blue-Timeline) -->
    <section id="resume" class="section">
      <div class="container">
        <div class="section-title">
          <h2 id="resume-heading"></h2>
        </div>
        <div class="resume-grid">
          <div class="resume-col" id="resume-col-left"></div>
          <div class="resume-col" id="resume-col-right"></div>
        </div>
      </div>
    </section>

    <!-- 7. Service & Prospective Students -->
    <section id="service" class="section">
      <div class="container">
        <div class="section-title">
          <h2 id="service-heading"></h2>
        </div>
        <div class="service-list" id="service-list"></div>
      </div>
    </section>

    <!-- 8. Contact -->
    <section id="contact" class="section">
      <div class="container">
        <div class="section-title">
          <h2 id="contact-heading"></h2>
        </div>
        <div class="contact-grid" id="contact-grid"></div>
      </div>
    </section>
  </main>

  <!-- Subtle Off-White Centered Footer -->
  <footer id="footer" class="footer">
    <div class="container">
      <h3 class="footer-name" id="footer-name"></h3>
      <p class="footer-motto" id="footer-motto"></p>
      <div class="footer-socials" id="footer-socials"></div>
      <div class="footer-copyright" id="footer-copy"></div>
    </div>
  </footer>

  <!-- Fixed Scroll-To-Top Button -->
  <a href="#home" class="scroll-top" id="scroll-top" aria-label="Scroll to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </a>

  <!-- Lightweight BibTeX Modal -->
  <div class="modal-backdrop" id="bib-modal" role="dialog" aria-modal="true" aria-labelledby="bib-modal-title" hidden>
    <div class="modal-dialog">
      <div class="modal-head">
        <h3 class="modal-title" id="bib-modal-title">BibTeX</h3>
        <button type="button" class="modal-close" id="bib-close" aria-label="Close">×</button>
      </div>
      <pre class="modal-pre" id="bib-code"></pre>
      <div class="modal-actions">
        <button type="button" class="btn-outline" id="bib-close-btn"></button>
        <button type="button" class="btn-solid" id="bib-copy-btn"></button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
